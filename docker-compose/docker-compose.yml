version: '3'

services:
  redis:
    image: redis:5
    container_name: redis
    restart: always
    command: redis-server --port 8379 --requirepass 99lWFIDUiAcxXWtGhjPK
    expose:
      - "8379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "8379", "-a", "99lWFIDUiAcxXWtGhjPK", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: always
    ports:
      - "13306:3306"
    volumes:
      - "./mysql/my.cnf:/etc/mysql/my.cnf"
      - "/disk1/archery/mysql:/var/lib/mysql"
      - "/disk2/archery:/data"
    environment:
      MYSQL_DATABASE: archery
      MYSQL_ROOT_PASSWORD: zuGfMklwMGGlDjKYFOpB
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  goinception:
    image: hanchuanchuan/goinception
    container_name: goinception
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - "./inception/config.toml:/etc/config.toml"

  archery:
    image: hhyo/archery:v1.12.12
    container_name: archery
    restart: always
    extra_hosts:
      - "ldaps.qiniu.io:10.68.12.22"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "9123:9123"
    volumes:
      - "./archery/settings.py:/opt/archery/local_settings.py"
      - "./archery/soar.yaml:/etc/soar.yaml"
      - "./archery/docs.md:/opt/archery/docs/docs.md"
      - "./archery/downloads:/opt/archery/downloads"
      - "./archery/sql/migrations:/opt/archery/sql/migrations"
      - "./archery/logs:/opt/archery/logs"
      - "./archery/keys:/opt/archery/keys"
      - "/disk2/archery/web:/opt/archery/static"
    entrypoint: "bash /opt/archery/src/docker/startup.sh"
    env_file:
      - .env
